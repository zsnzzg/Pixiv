name: 郑在镐 Pixiv 搜索
description: Pixiv Cookie 自动抓取 + Pixiv 搜索定时任务；支持 Safe / All / R18 / R18G，并可在模块设置中配置关键词、通知数量与排序。
author: 郑在镐
update_date: '2026-09-29'
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a2/e0/2d/a2e02d87-e20e-348f-c217-a289588893f6/AppIcon-0-0-1x_U007epad-0-85-220.png/512x512bb.png
homepage: https://t.me/zzg_tg
compat_arguments:
  CRON: "5 20 * * *"
compat_arguments_desc: "CRON：定时执行表达式，例如 5 20 * * * 表示每天 20:05。"
env_schema:
  CORE_WORDS:
    name: 🛡️ 核心关键词
    description: 核心/保底关键词；多个同义词可用 | 分隔。
    default_value: (守望先锋|斗阵特攻)
  NORMAL_WORDS:
    name: 🔍 普通关键词
    description: 普通搜索关键词，例如：黑百合|Widowmaker
    default_value: ''
  EXCLUDE_WORDS:
    name: ❌ 排除关键词
    description: 排除关键词；多个词用空格分隔。
    default_value: ''
  NOTIFY_COUNT:
    name: 🔔 通知数量
    description: 每轮发送的通知数量。
    default_value: '5'
  MODE:
    name: 🔞 内容模式
    description: safe = 全年龄；all = 全部；r18 = R18；safe / all / r18 均可独立使用；r18g 自动按 R18G → R18 → ALL 降级，最后进入核心词保底。
    default_value: r18
    options:
    - safe
    - all
    - r18
    - r18g
  ORDER:
    name: ↕️ 排序方式
    description: date_d 为新到旧；date 为旧到新。
    default_value: date_d
    options:
    - date_d
    - date
scriptings:
- http_request:
    name: Pixiv Cookie 自动抓取
    match: (?i)^https://www\.pixiv\.net/
    script_url: https://raw.githubusercontent.com/zsnzzg/Pixiv/main/Scripts/𝕏郑在镐Pixiv-cookie.js
    timeout: 30
- schedule:
    name: 郑在镐 Pixiv 搜索
    cron: "{{{CRON}}}"
    script_url: https://raw.githubusercontent.com/zsnzzg/Pixiv/main/Scripts/𝕏郑在镐Pixiv-search.js
    timeout: 60

mitm:
  hostnames:
    - www.pixiv.net
